name: images
on:
  schedule:
  - cron: '0 1 * * SUN'
  push:
permissions: write-all

jobs:
  images:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log In
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build
      run: docker build -t ghcr.io/${{ github.actor }}/doubango -f Dockerfile.alpine .

    - name: Publish
      run: docker push ghcr.io/${{ github.actor }}/doubango

